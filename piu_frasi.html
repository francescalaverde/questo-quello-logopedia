<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Più frasi – Questo o quello?</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,sans-serif;background:#f5f7fb;color:#203049}.shell{max-width:1160px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}.tag{font-size:14px;color:#55657c}h1{margin:4px 0 8px;font-size:clamp(23px,3vw,35px)}.panel{background:white;border:1px solid #e0e5ed;border-radius:19px;padding:17px;margin:15px 0;box-shadow:0 4px 20px #21314b0b}.controls{display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,select{font:inherit;border-radius:11px;border:1px solid #cdd7e6;padding:11px 15px;background:white;color:#1e314f;cursor:pointer}button.primary{background:#2158a8;color:white;border-color:#2158a8}button:disabled{opacity:.5;cursor:default}.pictures{display:grid;grid-template-columns:1fr 1fr;gap:14px}.target{border:3px solid #dce5f1;border-radius:15px;overflow:hidden;background:#f9fbff;min-width:0}.target.active{border-color:#2967ba}.target img{display:block;width:100%;aspect-ratio:1.5;object-fit:cover}.drop{min-height:70px;padding:9px;display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;border-top:2px dashed #d9e2f0}.hint{color:#7a8797;font-size:14px}.chip{background:#eaf1ff;border:1px solid #b6caee;border-radius:11px;padding:9px 12px;font-weight:650;cursor:pointer;text-align:center}.chip.sel{outline:3px solid #f1b33d}.chip.good{background:#e5f5e8;border-color:#69b37b}.chip.bad{background:#fff0ed;border-color:#e6a093}.bank{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;min-height:62px;align-items:center}.msg{min-height:25px;font-weight:650}.footer{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.tiny{font-size:13px;color:#62718a}.home{display:flex;gap:15px;flex-wrap:wrap}.home a{display:block;background:#e9f1ff;border-radius:14px;padding:20px;color:#164c96;text-decoration:none;font-weight:700;flex:1;min-width:220px}@media(max-width:650px){.shell{padding:12px}.pictures{gap:7px}.panel{padding:10px}.target img{aspect-ratio:1.05}.chip{font-size:13px;padding:7px}.drop{min-height:85px}button{padding:9px}}</style></head><body><main class="shell"><div class="top"><div><div class="tag">Attività logopedica • dimostrativi</div><h1>Questo o quello? · Più frasi</h1><p>Abbina tre frasi a ciascuna immagine: guarda, vede e vuole.</p></div><a href="index.html">← Menu</a></div><section class="panel controls"><span id="count"></span><span id="progress"></span><label for="level">Testo:</label><select id="level"><option value="full">Frasi complete</option><option value="short">Solo dimostrativo + nome</option></select><button id="restart">Ricomincia e mescola</button></section><section class="panel"><div class="pictures" id="pictures"></div></section><section class="panel"><p class="tiny">Frasi da abbinare (ordine casuale). Puoi trascinarle o toccare una frase e poi un'immagine.</p><div id="bank" class="bank"></div></section><section class="panel"><div class="footer"><div class="controls"><button class="primary" id="verify">Verifica</button><button id="reset">Riprova la prova</button><button id="next" disabled>Prossima prova →</button></div><span id="message" class="msg" aria-live="polite"></span></div></section></main><script>const MODE='multi';</script><script>const DATA=[{"id": "palla_spiaggia", "noun": "palla", "near": "questa", "far": "quella", "verb": "guarda"}, {"id": "mele", "noun": "mele", "near": "queste", "far": "quelle", "verb": "vuole"}, {"id": "libri", "noun": "libri", "near": "questi", "far": "quei", "verb": "vuole"}, {"id": "gatto", "noun": "gatto", "near": "questo", "far": "quel", "verb": "guarda"}, {"id": "palloni", "noun": "palloni", "near": "questi", "far": "quei", "verb": "guarda"}, {"id": "matite", "noun": "matite", "near": "queste", "far": "quelle", "verb": "vede"}, {"id": "biscotti", "noun": "biscotti", "near": "questi", "far": "quei", "verb": "vuole"}, {"id": "oca", "noun": "oca", "near": "quest'", "far": "quell'", "verb": "guarda"}, {"id": "bicicletta", "noun": "bicicletta", "near": "questa", "far": "quella", "verb": "vede"}, {"id": "orso", "noun": "orso", "near": "quest'", "far": "quell'", "verb": "vuole"}, {"id": "zaino", "noun": "zaino", "near": "questo", "far": "quello", "verb": "vede"}, {"id": "sedia", "noun": "sedia", "near": "questa", "far": "quella", "verb": "guarda"}, {"id": "palla_parco", "noun": "palla", "near": "questa", "far": "quella", "verb": "vede"}];</script><script>let order=[],index=0,placements={},selected=null,checked=false,completed=0,mode=MODE,level='full';
const $=id=>document.getElementById(id);
function shuffle(a){let b=[...a];for(let i=b.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
function phrase(verb,dem,noun){return level==='short'?(dem.endsWith("'")?dem+noun:dem+' '+noun):verb.toUpperCase()+' '+(dem.endsWith("'")?dem+noun:dem+' '+noun)}
function cards(){let d=order[index];let verbs=mode==='multi'?['guarda','vede','vuole']:[d.verb];return shuffle(verbs.flatMap((v,i)=>[{id:'n'+i,side:'near',txt:phrase(v,d.near,d.noun).toUpperCase()},{id:'f'+i,side:'far',txt:phrase(v,d.far,d.noun).toUpperCase()}]))}
let current=[];
function start(){order=shuffle(DATA);index=0;completed=0;render()}
function render(){checked=false;selected=null;placements={near:[],far:[]};let d=order[index];current=cards();$('count').textContent=`Prova ${index+1} di ${order.length}`;$('progress').textContent=`Completate: ${completed}`;$('message').textContent='';$('next').disabled=true;
let sides=shuffle(['near','far']);$('pictures').innerHTML=sides.map(side=>`<div class="target" data-side="${side}" tabindex="0" role="button" aria-label="Immagine ${side==='near'?'A':'B'}"><img alt="Scena con ${d.noun}" src="${d.id}_${side==='near'?'vicino':'lontano'}.webp"><div class="drop" id="drop-${side}"><span class="hint">Trascina qui una frase oppure selezionala e tocca l’immagine</span></div></div>`).join('');
document.querySelectorAll('.target').forEach(el=>{el.onclick=()=>place(el.dataset.side);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();place(el.dataset.side)}};el.ondragover=e=>e.preventDefault();el.ondrop=e=>{e.preventDefault();let id=e.dataTransfer.getData('text/plain');if(id){selected=id;place(el.dataset.side)}}});draw()}
function chip(c){let el=document.createElement('button');el.className='chip';el.textContent=c.txt;el.draggable=!checked;el.onclick=e=>{e.stopPropagation();if(checked)return;if(placements.near.includes(c.id)||placements.far.includes(c.id)){placements.near=placements.near.filter(x=>x!==c.id);placements.far=placements.far.filter(x=>x!==c.id);selected=null}else selected=selected===c.id?null:c.id;draw()};el.ondragstart=e=>{selected=c.id;e.dataTransfer.setData('text/plain',c.id)};if(selected===c.id)el.classList.add('sel');if(checked)el.classList.add((placements[c.side]||[]).includes(c.id)?'good':'bad');return el}
function draw(){let used=[...placements.near,...placements.far];let bank=$('bank');bank.innerHTML='';current.filter(c=>!used.includes(c.id)).forEach(c=>bank.append(chip(c)));for(let side of ['near','far']){let drop=$('drop-'+side);drop.innerHTML='';placements[side].forEach(id=>drop.append(chip(current.find(c=>c.id===id))));if(!placements[side].length)drop.innerHTML='<span class="hint">Seleziona una frase e tocca qui</span>'}}
function place(side){if(checked||!selected)return;for(let s of ['near','far'])placements[s]=placements[s].filter(id=>id!==selected);placements[side].push(selected);selected=null;draw()}
function verify(){if(checked)return;let used=[...placements.near,...placements.far];if(used.length!==current.length){$('message').textContent='Associa prima tutte le frasi.';return}let errors=current.filter(c=>!placements[c.side].includes(c.id));if(errors.length){$('message').textContent=`Ci sono ${errors.length} ${errors.length===1?'frase da rivedere':'frasi da rivedere'}. Riprova!`;document.querySelectorAll('.target').forEach(el=>el.classList.toggle('active',placements[el.dataset.side].some(id=>current.find(c=>c.id===id).side!==el.dataset.side)));return}checked=true;completed++;$('message').textContent='Ben fatto! Tutte le frasi sono abbinate correttamente.';$('progress').textContent=`Completate: ${completed}`;$('next').disabled=false;draw()}
$('verify').onclick=verify;$('reset').onclick=()=>render();$('next').onclick=()=>{if(index<order.length-1){index++;render()}else{$('message').textContent=`Attività completata! ${completed} prove corrette.`;$('next').disabled=true}};$('restart').onclick=start;$('level').onchange=e=>{level=e.target.value;render()};start();</script></body></html>
